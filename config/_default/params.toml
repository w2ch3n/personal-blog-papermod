mainSections = ["post"]
rssFullContent = true
favicon = "img/logo.jpg"

[footer]
  since = 2022

[dateFormat]
  published = ":date_full"
  lastUpdated = ":date_full"

[sidebar]
  subtitle = "后端工程师 · 记录学习、读书与生活"
  avatar = "img/logo.jpg"

[article]
  math = false
  toc = true
  readingTime = false

[article.license]
  enabled = true
  default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[article.list]
  showTags = false

[widgets]
  homepage = [
    { type = "search" },
    { type = "archives", params = { limit = 5 } },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 10 } },
  ]
  page = [{ type = "toc" }]

[imageProcessing.content]
  enabled = true
  widths = [800, 1600, 2400]

[imageProcessing.thumbnail]
  enabled = true

[colorScheme]
  toggle = true
  default = "auto"

[comments]
  enabled = false
